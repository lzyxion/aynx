# 커밋 전 게이트를 Windows 러너에서 그대로 돌린다 — CLAUDE.md "커밋 전 게이트" 와 같은 순서.
#
# - main 에 push 하면 돈다(사후 확인). PR 에도 돈다.
# - release.yml 은 이 워크플로를 다시 돌리지 않고, 태그 커밋에서 이 워크플로(main push)가 성공했는지만 본다.
# - CDP 하네스(scripts/dev/)는 앱 창이 필요해 여기에 넣지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: gate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml 의 버전 그대로 설치한다(로컬과 같은 컴파일러).
      - name: rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 러너의 기본 TEMP 는 8.3 짧은 이름(C:\Users\RUNNER~1\…)이라 git 이 돌려주는 긴 경로와
      # 글자 비교가 어긋난다 — 긴 이름 폴더(D:\a\_temp)로 돌린다.
      - name: long-name temp dir
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # 저장소를 만들어 커밋하는 시험이 있다 — 러너에는 git 사용자 정보가 없다.
      - name: git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run check:cycles
      # 방금 만든 build/ 를 읽는다 — build 뒤에 둔다.
      - run: npm run check:bundle

      # tauri 의 generate_context! 가 build/ 를 싣는다 — 프런트 빌드 뒤에 돈다.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
