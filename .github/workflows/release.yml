# 태그 `vX.Y.Z` 를 push 하면 사전 점검(그 커밋의 main CI 가 초록인지 · 서명 준비) 뒤 설치 파일 둘을 빌드해
# GitHub Release **초안**으로 올린다. 공개는 사람이 "What's new" 를 채우고 누른다.
#
# - 게이트(ci.yml)를 여기서 다시 돌리지 않는다(2026-11-12 — 같은 커밋을 두 번 검사하던 15분). 태그 커밋은 main 에 있고
#   그 커밋의 main push CI 가 성공했어야 한다 — 여러 커밋을 한 번에 push 하면 CI 는 맨 끝 커밋에서만 도니 태그는 거기에 붙인다.
# - 태그 · package.json · tauri.conf.json · Cargo.toml 의 버전이 하나라도 다르면 멈춘다.
# - 러너에서 빌드하므로 설치 파일에 로컬 사용자 경로가 들어가지 않는다.
# - 코드 서명은 없다(SmartScreen 안내는 노트에). **업데이터 서명은 있다**(2026-11-12 — 앱 안 업데이트): 이 빌드만
#   `createUpdaterArtifacts` 를 켜고(`--config src-tauri/tauri.updater.conf.json` 덮어쓰기 — tauri.conf.json 은 false 그대로라 로컬 `npm run tauri build` 는
#   키 없이 된다) 비밀 `TAURI_SIGNING_PRIVATE_KEY` · `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` 로 설치 파일 둘에 `.sig` 를 만든다.
# - `latest.json` — 앱이 읽는 업데이트 피드(`releases/latest/download/latest.json` — 초안 · 미리보기 릴리스는 보이지 않는다).
#   설치 종류마다 열쇠 하나(`windows-x86_64-nsis` · `windows-x86_64-msi`) — 앱이 제 설치 종류의 열쇠만 읽어 같은 종류로 갱신한다.
#   종류 없는 `windows-x86_64` 는 일부러 두지 않는다(src-tauri/src/updater.rs 머리말). `notes` 는 비워 둔다 — "What's new" 는
#   공개 전에 사람이 쓰므로, 카드에도 보이게 하려면 공개 전에 고친 latest.json 을 `gh release upload --clobber` 로 다시 올린다.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 사전 점검 — 빌드(15분 남짓)를 돌리기 전에 본다. ① 태그 커밋이 main 에 있고 그 커밋의 main CI 가 성공했는가(돌고 있으면
  # 끝날 때까지 기다린다) ② 업데이터 서명 준비 — 공개키가 자리표시자면 Tauri 가 빌드 끝의 서명 단계에서야
  # "failed to decode pubkey" 로 멈춘다(2026-11-12 로컬 재현).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: tag commit is on main and its CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main — merge to main first, then tag"
            exit 1
          fi
          q="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main"
          for i in $(seq 1 70); do
            r=$(gh api "$q" --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "none" else "\(.status) \(.conclusion) \(.html_url)" end')
            echo "CI for ${GITHUB_SHA:0:8}: $r"
            case "$r" in
              "completed success "*) exit 0 ;;
              completed*) echo "::error::main CI for this commit did not pass — fix main first"; exit 1 ;;
              none) if [ "$i" -ge 4 ]; then echo "::error::no main CI run for ${GITHUB_SHA:0:8} — tag the commit CI ran on (the tip of the push)"; exit 1; fi ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for main CI"
          exit 1

      - name: updater public key is real
        run: |
          node -e '
            const conf = require("./src-tauri/tauri.conf.json");
            const key = (conf.plugins?.updater?.pubkey ?? "").trim();
            let text = "";
            try { text = Buffer.from(key, "base64").toString("utf8"); } catch {}
            const lines = text.split(/\r?\n/);
            const ok = key !== "" && !key.startsWith("REPLACE_") && lines[0]?.startsWith("untrusted comment:") && /^[A-Za-z0-9+/=]{40,}$/.test((lines[1] ?? "").trim());
            if (!ok) {
              console.log("::error::src-tauri/tauri.conf.json plugins.updater.pubkey is not a real minisign public key — paste the contents of the .key.pub file before tagging");
              process.exit(1);
            }
            console.log("updater pubkey: " + lines[0]);
          '

      - name: signing secrets are set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEY" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -n "$PASSWORD" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::repository secret(s) not set:$missing"
            exit 1
          fi
          echo "signing secrets are set"

  build:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: versions match the tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$ver package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$ver" != "$pkg" ] || [ "$ver" != "$conf" ] || [ "$ver" != "$cargo" ]; then
            echo "::error::version mismatch — bump all three to $ver before tagging"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml 의 버전 그대로 설치한다(로컬과 같은 컴파일러).
      - name: rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # beforeBuildCommand 가 npm run build 를 부른다. 업데이터 산출물(.sig)은 이 빌드에서만 켠다 — 키가 없으면 멈춘다.
      - name: build (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set — the updater signature cannot be made"
            exit 1
          fi
          # 덮어쓰기는 파일로 준다(인라인 JSON 은 npm 이 Windows 셸로 넘기며 따옴표가 깨질 수 있다 — 경로는 공식 문서의 꼴 그대로).
          npm run tauri build -- --config src-tauri/tauri.updater.conf.json

      - name: collect installers
        id: files
        run: |
          v="${{ steps.ver.outputs.version }}"
          b=src-tauri/target/release/bundle
          exe="$b/nsis/Aynx_${v}_x64-setup.exe"
          msi="$b/msi/Aynx_${v}_x64_en-US.msi"
          for f in "$exe" "$msi" "$exe.sig" "$msi.sig"; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -R "$b"; exit 1; }
          done
          mkdir -p out sig
          cp "$exe" "$msi" out/
          cp "$exe.sig" "$msi.sig" sig/
          (cd out && sha256sum Aynx_* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # 업데이트 피드 — 설치 종류마다 주소 · 서명(.sig 파일의 글자 그대로). 주소는 이 태그의 내려받기 경로다.
      - name: updater feed (latest.json)
        run: |
          v="${{ steps.ver.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          V="$v" BASE="$base" PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node -e '
            const fs = require("fs");
            const v = process.env.V, base = process.env.BASE;
            const sig = (f) => fs.readFileSync("sig/" + f + ".sig", "utf8").trim();
            const exe = `Aynx_${v}_x64-setup.exe`, msi = `Aynx_${v}_x64_en-US.msi`;
            const feed = {
              version: v,
              notes: "",
              pub_date: process.env.PUB_DATE,
              platforms: {
                "windows-x86_64-nsis": { url: `${base}/${exe}`, signature: sig(exe) },
                "windows-x86_64-msi": { url: `${base}/${msi}`, signature: sig(msi) },
              },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(feed, null, 2) + "\n");
          '
          cat out/latest.json

      - name: release notes skeleton
        run: |
          v="${{ steps.ver.outputs.version }}"
          {
            echo "## What's new"
            echo
            echo "- _(write before publishing)_"
            echo
            echo "## Install"
            echo
            echo "| File | Installs for |"
            echo "|---|---|"
            echo "| \`Aynx_${v}_x64-setup.exe\` | the current user (no admin rights needed) |"
            echo "| \`Aynx_${v}_x64_en-US.msi\` | all users |"
            echo
            echo "- **Windows 11 only** (WebView2). Linux and macOS support is undecided."
            echo "- The installers are **unsigned**, so Windows SmartScreen may warn on first run. Choose **More info → Run anyway**."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } > out/notes.md

      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "Aynx $v" \
            --notes-file out/notes.md \
            "out/Aynx_${v}_x64-setup.exe" "out/Aynx_${v}_x64_en-US.msi" "out/latest.json"
